---
# The command wires sources to the capacity model and metrics export.
version: 3

allow:
  depOnAnyVendor: false
  deepScan: false

components:
  cmd: {in: cmd/*}
  capacity: {in: internal/capacity}
  export: {in: internal/export}
  codex: {in: internal/source/codex}

vendors:
  otel: {in: go.opentelemetry.io/**}
  testify: {in: github.com/stretchr/testify/**}

# go-arch-lint requires a non-empty dependency list for each component.
deps:
  cmd:
    mayDependOn: [cmd, capacity, export, codex]
    canUse: [otel, testify]
  capacity:
    mayDependOn: [capacity]
    canUse: [testify]
  export:
    mayDependOn: [capacity, export]
    canUse: [otel, testify]
  codex:
    mayDependOn: [capacity, codex]
    canUse: [testify]
