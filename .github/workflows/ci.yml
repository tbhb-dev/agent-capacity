---
# Main quality gate. Bazel pins every tool and owns every gate: the
# hermetic checks are cached `bazel test` targets, so `bazel test //...`
# runs them all, and the few that need the network, Git history or the
# GitHub API run in the shared `repo` job. The shared setup, repository
# checks and conclusion logic come from tbhb-dev/rules. A final `conclusion`
# job gives branch protection one stable required check.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Bazel 9.x only, the version .bazelversion pins, on Linux (x86_64 and
  # arm64) and macOS (arm64). The checks that need the
  # network or GitHub's API run on Linux only; they do not depend on the OS.
  bazel:
    name: "bazel (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    # Unmeasured without mutation testing: keep the 90-minute limit until a run shows the time.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, ubuntu-26.04-arm, macos-26]
        include:
          - os: ubuntu-26.04
            release: release
          - os: ubuntu-26.04-arm
            release: release
          - os: macos-26
            release: release
    defaults:
      run:
        shell: bash
    steps:
      # Full history: the release build stamps the version through
      # `git describe`.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # Hardens the runner, sets up Bazel and fetches, with the platform
      # workarounds, from tbhb-dev/rules.
      - name: Set up Bazel for CI
        uses: tbhb-dev/rules/.github/actions/setup-bazel-ci@c90ce38c84b6a00fa0f61888799499f32f22f9d4  # main
        with:
          disk-cache: ${{ github.workflow }}-${{ matrix.os }}
          cache-save: ${{ github.event_name != 'pull_request' }}

      # //... is every hermetic gate: the whole-tree lint tests (secrets in
      # the working tree, YAML, TOML, Markdown, prose, EditorConfig,
      # workflows, shell, CODEOWNERS paths), the format check, Starlark
      # lint, nogo during the build, the Go and Python tests and linters,
      # condition coverage, the docs bundle and REUSE checks, the import
      # contracts, and the preset staleness test.
      - name: Test
        run: bazelisk test --config=ci --build_tests_only -- //... -//:gomutants_test

      - name: Build the release binary
        env:
          RELEASE_CONFIG: ${{ matrix.release }}
        run: bazelisk build "--config=${RELEASE_CONFIG}" //cmd/agent-capacity

      # A failed run's test logs, so a failure that does not recur can still
      # be read.
      - name: Keep the test logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: testlogs-${{ matrix.os }}
          path: |
            .bazel-testlogs/**/test.log
            .bazel-testlogs/**/test.xml
          # The convenience links are dotfiles, which the action skips by default.
          include-hidden-files: true
          if-no-files-found: ignore

  # Mutation testing of every package, on one OS leg. It ran inside the bazel job before.
  mutation:
    name: mutation
    runs-on: ubuntu-26.04
    # Unmeasured: no run has finished yet. Set this from the first finished run.
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Bazel for CI
        uses: tbhb-dev/rules/.github/actions/setup-bazel-ci@c90ce38c84b6a00fa0f61888799499f32f22f9d4  # main
        with:
          disk-cache: ${{ github.workflow }}-mutation
          cache-save: ${{ github.event_name != 'pull_request' }}

      - name: Test
        run: bazelisk test --config=ci //:gomutants_test

  # Build both Linux images and check runtime defaults without a daemon.
  container:
    name: container
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Bazel for CI
        uses: tbhb-dev/rules/.github/actions/setup-bazel-ci@c90ce38c84b6a00fa0f61888799499f32f22f9d4  # main
        with:
          disk-cache: ${{ github.workflow }}-container
          cache-save: ${{ github.event_name != 'pull_request' }}
          targets: //container:image_multiarch //container:image_config_test

      - name: Build and test the Linux images
        run: >-
          bazelisk test --config=ci --config=release --nofetch
          //container:image_multiarch //container:image_config_test

  # The repository-level checks, in the shared workflow, on Linux beside the
  # bazel matrix so they don't wait behind the tests: gazelle, MODULE.bazel
  # tidiness, the history scan, the Python audit, govulncheck (the `bazel run`
  # target, whose SARIF is kept as an artifact), zizmor online and CODEOWNERS.
  repo:
    name: repo
    permissions:
      contents: read
    uses: tbhb-dev/rules/.github/workflows/repo-checks.yml@c90ce38c84b6a00fa0f61888799499f32f22f9d4  # main
    with:
      gazelle-dirs: .
      govulncheck-target: //:govulncheck
      module-dirs: .

  # Scan this module's dependencies with the pinned public scanner.
  gomodscan:
    name: gomodscan
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write  # Upload the dependency scan to Code Scanning.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout the scanner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: tbhb-dev/gomodscan
          ref: 1d7083e6ee351b0b4d7705c9c2346ad45d43127c
          path: tmp/gomodscan
          persist-credentials: false

      - name: Set up Bazel for CI
        uses: tbhb-dev/rules/.github/actions/setup-bazel-ci@c90ce38c84b6a00fa0f61888799499f32f22f9d4  # main
        with:
          targets: '@rules_go//go'

      - name: Vendor the module in a scratch copy
        run: |
          scratch="${RUNNER_TEMP}/vendored"
          mkdir "${scratch}"
          cp -R go.mod go.sum cmd internal "${scratch}/"
          bazelisk run --config=ci @rules_go//go -- -C "${scratch}" mod vendor
          # A module without dependencies has an empty vendor manifest.
          mkdir -p "${scratch}/vendor"
          touch "${scratch}/vendor/modules.txt"

      - name: Run gomodscan (SARIF)
        working-directory: tmp/gomodscan
        run: |
          status=0
          bazelisk run --config=ci //cmd/gomodscan -- \
            -modroot "${RUNNER_TEMP}/vendored" \
            -format sarif -o "${GITHUB_WORKSPACE}/gomodscan.sarif" || status=$?
          if ((status > 1)); then exit "${status}"; fi

      - name: Upload the gomodscan SARIF
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3
        with:
          sarif_file: gomodscan.sarif
          category: agent-capacity-dependencies

  # One stable required check for branch protection. `if: always()` runs it
  # even when a needed job failed. It passes only when every needed job's
  # result is exactly "success", so a gate that was skipped, cancelled or
  # never finished cannot pass. A matrix with a cancelled leg reports
  # "abandoned", not "cancelled", so the check lists what passes, not what
  # fails.
  conclusion:
    name: conclusion
    if: always()
    needs: [bazel, repo, gomodscan, container, mutation]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Fail if any needed job did not succeed
        uses: tbhb-dev/rules/.github/actions/ci-conclusion@c90ce38c84b6a00fa0f61888799499f32f22f9d4  # main
        with:
          needs: ${{ toJSON(needs) }}
