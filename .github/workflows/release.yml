---
# Release on a pushed `v*` tag: build the static binary on a native runner
# for each platform, then attach the binaries and a SHA256SUMS file to a
# GitHub release. Only the `release` job can write to the repository.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Refuses a tag unless its commit is on main and its newest `conclusion`
  # check run succeeded. `conclusion` is the check ci.yml gives branch
  # protection; it must come from the GitHub Actions app (ID 15368, as in the
  # ruleset) on the exact tagged sha. A tag ruleset is the real control over
  # who can push a tag; this job only checks the commit.
  verify:
    name: verify
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read  # Compare the tagged commit with main.
      checks: read  # List the check runs of the tagged commit.
    # bash runs with pipefail, so a failing `gh api` aborts the check-run step at the assignment.
    defaults:
      run:
        shell: bash
    steps:
      - name: Require the tagged commit to be on main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          status=$(gh api "repos/${GH_REPO}/compare/main...${SHA}" --jq .status)
          case "${status}" in
            identical | behind) ;;
            *)
              echo "::error::${SHA} is not reachable from main (compare status: ${status})."
              exit 1
              ;;
          esac

      - name: Require a passing conclusion check on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          passed=$(gh api --paginate --slurp \
            "repos/${GH_REPO}/commits/${SHA}/check-runs?check_name=conclusion&filter=all&per_page=100" \
            | jq -r '[.[].check_runs[] | select(.app.id == 15368)]
              | sort_by(.id) | last | select(.conclusion == "success") | .id')
          if [ -z "${passed}" ]; then
            echo "::error::The newest conclusion check run for ${SHA} did not succeed. Tag a commit that passed ci."
            exit 1
          fi

  # The release build, as the `bazel` job in ci.yml builds it. The stamp
  # that `--config=release` computes is not consumed yet: the binary prints
  # a fixed version. The binary is static: `//cmd/agent-capacity` sets `pure = "on"`, so cgo is
  # off.
  build:
    name: "build (${{ matrix.os }})"
    needs: [verify]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            platform: darwin-arm64
          - os: ubuntu-26.04
            platform: linux-amd64
          - os: ubuntu-26.04-arm
            platform: linux-arm64
    defaults:
      run:
        shell: bash
    steps:
      # Full history, for the workspace status script's `git describe`.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Bazel for CI
        uses: tbhb-dev/rules/.github/actions/setup-bazel-ci@1fc6bf8b17b14a62712ae9dd076c4171147693d0  # main
        with:
          disk-cache: ${{ github.workflow }}-${{ matrix.os }}
          cache-save: false

      - name: Build the release binary
        run: bazelisk build --config=ci --config=release //cmd/agent-capacity

      - name: Name the binary for its platform
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          # The query prints the path relative to the execution root.
          relative=$(bazelisk cquery --config=ci --config=release --output=files //cmd/agent-capacity)
          root=$(bazelisk info --config=ci --config=release execution_root)
          mkdir dist
          cp "${root}/${relative}" "dist/agent-capacity-${PLATFORM}"

      - name: Keep the binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: agent-capacity-${{ matrix.platform }}
          path: dist/agent-capacity-${{ matrix.platform }}
          if-no-files-found: error

  # The only job with write access. It runs only when the check and every build passed.
  release:
    name: release
    needs: [verify, build]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write  # Create the release and attach the files.
    steps:
      - name: Download the binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: agent-capacity-*
          path: dist
          merge-multiple: true

      - name: Write the checksums
        working-directory: dist
        run: sha256sum agent-capacity-* > SHA256SUMS

      # A moved tag must not publish a release for another commit. An
      # annotated tag points at a tag object, which resolves to the commit.
      - name: Require the tag to still point at the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          type=$(gh api "repos/${GH_REPO}/git/ref/tags/${TAG}" --jq .object.type)
          object=$(gh api "repos/${GH_REPO}/git/ref/tags/${TAG}" --jq .object.sha)
          if [ "${type}" = tag ]; then
            object=$(gh api "repos/${GH_REPO}/git/tags/${object}" --jq .object.sha)
          fi
          if [ "${object}" != "${SHA}" ]; then
            echo "::error::Tag ${TAG} now points at ${object}, not ${SHA}."
            exit 1
          fi

      # A draft, so nobody sees a release without its files. It goes public
      # after the binaries and SHA256SUMS are attached.
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: >-
          gh release create "${TAG}" dist/agent-capacity-* dist/SHA256SUMS
          --draft --verify-tag --title "${TAG}" --generate-notes

      # Check that the draft holds exactly the release files before publishing.
      # The list is fixed, so a missing binary or an extra file fails here.
      # Update it with the build matrix, and keep it in the order jq sorts to (uppercase first).
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          expected="SHA256SUMS agent-capacity-darwin-arm64 agent-capacity-linux-amd64 agent-capacity-linux-arm64"
          attached=$(gh release view "${TAG}" --json assets --jq '[.assets[].name] | sort | join(" ")')
          if [ "${attached}" != "${expected}" ]; then
            echo "::error::Draft ${TAG} holds [${attached}], not [${expected}]."
            exit 1
          fi
          gh release edit "${TAG}" --draft=false
